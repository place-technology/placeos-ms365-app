# Checks pull requests: lint, type-check, unit tests and a production build. Deploying is build.yml's job.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint, type-check and test
        run: |
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Build (production)
        run: npm run build
